<style>
/* Layout: app shell framed in the page gutter — sticky sidebar panel (232px) + one content column; tables and stacked histograms carry the data. Tokens follow the ITO design system (grafite + âmbar de sinalização). */
:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-muted: #F7F8FA; --surface-2: #F0F2F5;
  --line: #E4E7EC; --line-strong: #D0D5DD;

  --deep-a: #363A40; --deep-b: #1F2226; --on-deep: #FFFFFF; --on-deep-muted: rgba(255,255,255,.76);
  --ok: #1F8A5B; --ok-tint: #E7F4EC; --err: #C0392B; --err-tint: #F9E1E1;
  --d1: #8A6400; --d2: #E0A800; --d3: #F5D36B; --d4: #B5651D; --d5: #D9822B; --d6: #5E4400;
  --i1: #17191C; --i2: #475467; --i3: #6B7A8F; --i4: #98A2B3; --i5: #C3CAD3; --i6: #2F3B48;
  --m1: #0F6E6E; --m2: #3D9A97; --x1: #7A4B8C; --x2: #A0729F;
  --c1: #17191C; --c2: #475467; --c3: #8A6400; --c4: #B98600; --c5: #6B7A8F; --c6: #A3AFBF; --c7: #E0A800; --c8: #F5D36B; --c9: #0F6E6E; --c10: #7A4B2A; --c11: #3D9A97; --c12: #D0D5DD;
  --l1: #17191C; --l2: #B98600; --l3: #6B7A8F; --l4: #0F6E6E;
  --shadow-sm: 0 4px 16px rgba(16,24,40,.05); --shadow-md: 0 14px 34px rgba(16,24,40,.12); --shadow-lg: 0 24px 56px rgba(16,24,40,.14);
  --scrim: rgba(16,24,40,.32);
  --font: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111315; --surface: #181B1E; --surface-muted: #15181B; --surface-2: #232830;
  --line: #2A2F35; --line-strong: #3A4048;
  --ink: #F2F3F5; --body: #C9CED6; --muted: #98A2B3; --faint: #667085;
  --amber: #F2B705; --amber-hi: #F8CB3E; --amber-text: #F2C94C; --amber-tint: #2C2510; --on-amber: #17191C;
  --active-bg: #E9EBEE; --active-fg: #17191C;
  --deep-a: #2A2E33; --deep-b: #1C1F22; --on-deep: #F2F3F5; --on-deep-muted: rgba(242,243,245,.72);
  --ok: #4CC38A; --ok-tint: #12301F; --err: #F07167; --err-tint: #3A1A18;
  --d1: #B98600; --d2: #F2B705; --d3: #F7E09A; --d4: #D27A3A; --d5: #F0A35E; --d6: #8A6A1E;
  --i1: #E9EBEE; --i2: #98A2B3; --i3: #8FA0B5; --i4: #667085; --i5: #4A5462; --i6: #C9CED6;
  --m1: #3D9A97; --m2: #7CC6C1; --x1: #B48CC4; --x2: #D2B1D0;
  --c1: #E9EBEE; --c2: #98A2B3; --c3: #B98600; --c4: #F2C94C; --c5: #8FA0B5; --c6: #5C6677; --c7: #F2B705; --c8: #F7E09A; --c9: #3D9A97; --c10: #C08457; --c11: #7CC6C1; --c12: #3A4048;
  --l1: #E9EBEE; --l2: #F2B705; --l3: #8FA0B5; --l4: #3D9A97;
  --shadow-sm: 0 4px 16px rgba(0,0,0,.25); --shadow-md: 0 14px 34px rgba(0,0,0,.35); --shadow-lg: 0 24px 56px rgba(0,0,0,.45);
  --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111315; --surface: #181B1E; --surface-muted: #15181B; --surface-2: #232830;
  --line: #2A2F35; --line-strong: #3A4048;
  --ink: #F2F3F5; --body: #C9CED6; --muted: #98A2B3; --faint: #667085;
  --amber: #F2B705; --amber-hi: #F8CB3E; --amber-text: #F2C94C; --amber-tint: #2C2510; --on-amber: #17191C;
  --active-bg: #E9EBEE; --active-fg: #17191C;
  --deep-a: #2A2E33; --deep-b: #1C1F22; --on-deep: #F2F3F5; --on-deep-muted: rgba(242,243,245,.72);
  --ok: #4CC38A; --ok-tint: #12301F; --err: #F07167; --err-tint: #3A1A18;
  --d1: #B98600; --d2: #F2B705; --d3: #F7E09A; --d4: #D27A3A; --d5: #F0A35E; --d6: #8A6A1E;
  --i1: #E9EBEE; --i2: #98A2B3; --i3: #8FA0B5; --i4: #667085; --i5: #4A5462; --i6: #C9CED6;
  --m1: #3D9A97; --m2: #7CC6C1; --x1: #B48CC4; --x2: #D2B1D0;
  --c1: #E9EBEE; --c2: #98A2B3; --c3: #B98600; --c4: #F2C94C; --c5: #8FA0B5; --c6: #5C6677; --c7: #F2B705; --c8: #F7E09A; --c9: #3D9A97; --c10: #C08457; --c11: #7CC6C1; --c12: #3A4048;
  --l1: #E9EBEE; --l2: #F2B705; --l3: #8FA0B5; --l4: #3D9A97;
  --shadow-sm: 0 4px 16px rgba(0,0,0,.25); --shadow-md: 0 14px 34px rgba(0,0,0,.35); --shadow-lg: 0 24px 56px rgba(0,0,0,.45);
  --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 56px; }
.shell { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 24px; align-items: start; }
.side { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--surface-muted); border: 1px solid var(--line); border-radius: 20px; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 32px); overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--amber); color: var(--on-amber); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.brand-word { font-family: var(--mono); font-size: 13px; letter-spacing: .32em; font-weight: 500; }
.navlabel { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--muted); padding: 14px 10px 6px; text-transform: uppercase; }
.navitem { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 0; background: transparent; color: var(--body); text-align: left; font-size: 14px; }
.navitem:hover { background: var(--surface-2); }
.navitem[aria-current="page"] { background: var(--active-bg); color: var(--active-fg); font-weight: 500; }
.navitem svg { width: 16px; height: 16px; flex-shrink: 0; }
.navcount { margin-left: auto; font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--amber-tint); color: var(--amber-text); }
.navitem[aria-current="page"] .navcount { background: var(--amber); color: var(--on-amber); }
.side-foot { margin-top: auto; padding: 18px 10px 0; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--amber-text); font-size: 12px; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 24px; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; position: relative; }
.search { flex: 1 1 260px; max-width: 480px; height: 42px; border-radius: 999px; background: var(--surface-muted); border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted); position: relative; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); font-size: 13px; }
.kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 5px; }
.results { position: absolute; top: 48px; left: 0; right: 0; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 6px; display: flex; flex-direction: column; }
.result { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 0; background: transparent; text-align: left; color: var(--ink); }
.result:hover, .result:focus-visible { background: var(--surface-muted); }
.spacer { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--active-bg); color: var(--active-fg); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.head-text { display: flex; flex-direction: column; gap: 8px; max-width: 780px; min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.eyebrow button { border: 0; background: none; padding: 0; color: var(--muted); font: inherit; letter-spacing: inherit; text-transform: inherit; }
.eyebrow button:hover { color: var(--ink); }
h1 { font-size: clamp(28px, 3.2vw, 40px); line-height: 1.15; letter-spacing: -.02em; font-weight: 600; }
.lede { margin: 0; font-size: 15px; color: var(--body); line-height: 1.6; max-width: 70ch; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, box-shadow .15s; }
.btn:hover { background: var(--surface-muted); }
.btn-primary { border: 0; background: linear-gradient(180deg, var(--amber-hi) 0%, var(--amber) 100%); color: var(--on-amber); font-weight: 600; box-shadow: var(--shadow-md); }
.btn-primary:hover { background: var(--amber); }
.btn-dark { border: 0; background: var(--active-bg); color: var(--active-fg); }
.btn-dark:hover { background: var(--active-bg); opacity: .9; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; font-size: 18px; color: var(--ink); }
.iconbtn[disabled] { opacity: .4; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { min-height: 38px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; color: var(--body); font-size: 14px; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--active-bg); color: var(--active-fg); font-weight: 500; }
.chip[disabled] { opacity: .45; cursor: not-allowed; }
.tabbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 4px; gap: 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-muted); }
.seg button { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: var(--body); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--active-bg); color: var(--active-fg); font-weight: 500; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.b-neutral { background: var(--surface-2); color: var(--body); }
.b-amber { background: var(--amber-tint); color: var(--amber-text); }
.b-deep { background: var(--active-bg); color: var(--active-fg); }
.b-ok { background: var(--ok-tint); color: var(--ok); }
.b-err { background: var(--err-tint); color: var(--err); }
.pill-ok { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--ok-tint); color: var(--ok); white-space: nowrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
.card-pad { padding: 20px 22px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 16px; font-weight: 500; }
.card-body { padding: 20px 22px; }
.glass { background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 94%, transparent), color-mix(in srgb, var(--surface-muted) 74%, transparent)); }
.deep { background: linear-gradient(180deg, var(--deep-a) 0%, var(--deep-b) 100%); color: var(--on-deep); border-color: var(--deep-b); box-shadow: var(--shadow-md); }
.label { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; line-height: 1.4; }
.deep .label { color: var(--amber); }
.tint { background: var(--amber-tint); border-color: transparent; }
.tint .label { color: var(--amber-text); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.kpi-v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.kpi-s { font-size: 12px; color: var(--muted); }
.deep .kpi-s { color: var(--on-deep-muted); }
.tblwrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.data th { background: var(--surface-muted); color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .12em; font-weight: 500; text-transform: uppercase; text-align: left; padding: 12px; white-space: nowrap; }
table.data td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; color: var(--body); }
table.data td.strong, table.data td strong { color: var(--ink); }
table.data th:first-child, table.data td:first-child { padding-left: 22px; }
table.data th:last-child, table.data td:last-child { padding-right: 22px; }
table.data .r { text-align: right; }
table.data tr.total td { background: var(--surface-muted); color: var(--ink); font-weight: 600; }
table.data tr.hl td { background: var(--amber-tint); color: var(--ink); font-weight: 600; }
table.data tr.grow td { background: var(--surface-muted); font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-top: 8px; padding-bottom: 8px; }
table.data tr.subt td { font-weight: 600; color: var(--ink); }
table.data tr.muted td { color: var(--muted); }
.th-sort { border: 0; background: none; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; gap: 4px; align-items: center; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
.cellbtn { width: 100%; min-height: 30px; border: 0; border-radius: 8px; text-align: right; padding: 0 8px; font-variant-numeric: tabular-nums; color: var(--ink); }
.cellbtn:hover { outline: 1px solid var(--line-strong); }
.sub { font-size: 12px; color: var(--muted); }
table.tobras td, table.tobras th { padding-left: 9px; padding-right: 9px; }
table.tobras td { padding-top: 9px; padding-bottom: 9px; }
@media (max-width: 1340px) { table.tobras .col-hist { display: none; } }
table.tobras th:first-child, table.tobras td:first-child { padding-left: 18px; }
table.tobras th:last-child, table.tobras td:last-child { padding-right: 18px; }
.obralink { border: 0; background: none; padding: 0; font-weight: 600; color: var(--ink); text-align: left; font-size: 14px; }
.obralink:hover { text-decoration: underline; text-underline-offset: 3px; }
.check { width: 18px; height: 18px; accent-color: var(--active-bg); }
.selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px 10px 18px; border-radius: 999px; background: var(--active-bg); color: var(--active-fg); }
.selbar .btn { min-height: 36px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--body); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart { display: flex; flex-direction: column; gap: 8px; }
.plot { position: relative; height: 250px; padding-left: 44px; }
.gl { position: absolute; left: 44px; right: 0; border-top: 1px dashed var(--line); }
.gl span { position: absolute; right: calc(100% + 8px); top: -8px; font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.gl.base { border-top: 1px solid var(--line-strong); }
.cols { position: absolute; left: 44px; right: 0; top: 0; bottom: 0; display: flex; align-items: flex-end; gap: clamp(4px, 1.6vw, 22px); padding: 0 6px; }
.col { flex: 1 1 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; }
.ctot { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.stack { width: 100%; max-width: 72px; display: flex; flex-direction: column-reverse; border-radius: 5px 5px 0 0; overflow: hidden; }
.stack i { display: block; flex-basis: 0; min-height: 0; }
.grp { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
.gb { flex: 1 1 0; max-width: 18px; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; }
.gb b { font-family: var(--mono); font-size: 9px; font-weight: 500; color: var(--body); line-height: 1; white-space: nowrap; }
.gb i { width: 100%; display: block; border-radius: 3px 3px 0 0; }
.xl { display: flex; gap: clamp(4px, 1.6vw, 22px); padding: 0 6px 0 50px; }
.xl span { flex: 1 1 0; text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; min-width: 0; overflow: hidden; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
.spark i { width: 8px; background: var(--d1); border-radius: 2px 2px 0 0; display: block; }
svg.line { width: 100%; height: auto; display: block; overflow: visible; }
.compbar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.compbar i { display: block; height: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.split { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.split > .rail { flex: 1 1 280px; max-width: 360px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.split > .work { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.stack-gap { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }

    const maxQ = Math.max(0, ...Array.from({ length: nM(o) }, (_, i) => cabm(o, k, i)));
    for (let j = 0; j < maxQ; j++) {
      const mat = 1000 + fi * 100 + j + 1;
      meses.forEach((m, i) => {
        const cb = cabm(o, k, i); if (j >= cb) return;
        const x = qm(o, k, i) / cb, hMul = 0.6 + rnd(o.id + mat + i) * 0.8, aAdd = (rnd('a' + o.id + mat + i) - .5) * .04;
        const de = (i === nM(o) - 1 && j < Math.round(cb * 0.5)) ? 1 : 0;
        const c = custoFun(o, k, i, p, null, { x, hMul, aAdd, ad: 0, de, semVT: rnd('vt' + o.id + mat) < 0.08 });
        rows.push(Object.assign(c, { mat, i, mes: m }));
      });
    }
  });
  return rows;
}

function apropriacao(o, C) {
  const n = C.n, rows = {};

  C.ks.forEach(k => { const f = fun(k); C.F[k].forEach((c, i) => {
    add(f.pc || '—', PCN[f.pc] || f.n, i, c.salv + c.extras + c.he + c.dsr + c.enc + c.prov + c.resc + c.nf + c.rl + c.ferr);
    add('04.02.07', PCN['04.02.07'], i, c.vt);
    BEN.forEach(b => { if (c.benB[b.k]) add(b.pc, PCN[b.pc], i, c.benB[b.k]); });
    add('04.01.03', PCN['04.01.03'], i, c.exames);

  return Object.values(rows).filter(r => sum(r.v) > 0.5).sort((a, b) => a.pc.localeCompare(b.pc));
}

    addferemp: () => { if (!S.nfer.d || !S.nfer.n.trim()) return; D.params.cal.extras = (D.params.cal.extras || []).concat({ d: S.nfer.d, n: S.nfer.n.trim() }); S.calAno = Number(S.nfer.d.slice(0, 4)); S.nfer = { d: '', n: '' }; commit('Feriado da empresa adicionado'); },
    addferloc: () => { const o = obra(S.obraId); if (!S.nfer.d || !S.nfer.n.trim()) return; o.ferLoc = (o.ferLoc || []).concat({ d: S.nfer.d, n: S.nfer.n.trim() }); S.nfer = { d: '', n: '' }; commit('Feriado municipal adicionado'); },
    addtroca: () => { const o = obra(S.obraId), anos = Object.keys(D.params.datas).map(Number).filter(y => y !== o.base); o.trocas = (o.trocas || []).concat({ i: Math.min(nM(o) - 1, Math.floor(nM(o) / 2)), base: anos.find(y => y > o.base) || anos[0], motivo: 'Incluída manualmente' }); commit('Troca de tabela adicionada'); },
    addreal: () => { const o = obra(S.obraId), N = S.nreal; if (!String(N.outra).trim()) return; o.realoc = (o.realoc || []).concat({ id: 'r' + Date.now(), tipo: N.tipo, k: N.k, i0: Number(N.i0), i1: Math.max(Number(N.i0), Number(N.i1)), qtd: Math.max(1, Number(N.qtd) || 1), outra: String(N.outra).trim(), vt: Number(N.vt) || 0 }); S.nreal = { tipo: 'cedida', k: 'carp', i0: 0, i1: 0, qtd: 1, outra: '', vt: 0 }; commit('Realocação registrada'); },
    wmixref: () => { S.wiz.p.heMix = null; render(); },
    reajauto: () => { S.wiz.p.reaj = null; render(); },
    addcct: () => { const b = clone(cctDe('bh') || D.ccts[0]); b.id = 'cct' + Date.now(); b.n = 'Nova convenção'; D.ccts.push(b); S.cctSel = b.id; S.cctQ = ''; S.cctSort = 'nome'; S.cctPag = Math.floor(D.ccts.slice().sort((x, y) => x.n > y.n ? 1 : -1).findIndex(x => x.id === b.id) / 10); S.cctVerCmp = false; commit('Convenção criada a partir da de BH · edite o nome e os salários'); },
    dupcct: () => { const o = cctDe(S.cctSel) || D.ccts[0], b = clone(o); b.id = 'cct' + Date.now(); b.n = o.n + ' (cópia)'; D.ccts.push(b); S.cctSel = b.id; S.cctQ = ''; commit('Convenção duplicada'); },
    delcct: () => { const t = cctDe(S.cctSel); if (!t || D.cidades.some(c => c.cct === t.id)) return; D.ccts = D.ccts.filter(x => x.id !== t.id); S.cctCmp = (S.cctCmp || []).filter(x => x !== t.id); S.cctSel = (D.ccts[0] || {}).id; commit('Convenção excluída'); },
    cctcmpver: () => { S.cctVerCmp = true; render(); }, cctcmpfecha: () => { S.cctVerCmp = false; render(); }, cctcmplimpa: () => { S.cctCmp = []; S.cctVerCmp = false; render(); },
    cctlote: () => { const t = cctDe(S.cctSel), f = 1 + (Number(S.cctLote) || 0) / 100; if (!t) return; Object.keys(t.sal).forEach(k => { t.sal[k] = Math.round(t.sal[k] * f * 100) / 100; }); Object.keys(t.grat || {}).forEach(k => { t.grat[k] = Math.round(t.grat[k] * f * 100) / 100; }); commit('Salários e gratificações de ' + t.n + ' reajustados em ' + nf(Number(S.cctLote) || 0, 1) + '%'); },
    addcid: () => { const n = S.ncid.n.trim(); if (!n) return; const base = n.toLowerCase().normalize('NFD').replace(/[^a-z]/g, '').slice(0, 10) || 'cidade'; let id = base, i = 2; while (cidade(id)) id = base + i++; D.cidades.push({ id, n, cct: S.ncid.cct, tarifa: 5, cond: 1, iss: 3, fer: [], vtDe: {} }); S.ncid = { n: '', cct: S.ncid.cct }; commit(n + ' adicionada'); },
    savecfer: () => { const F = S.ncfer, m = String(F.md).match(/^(\d{1,2})\/(\d{1,2})$/); if (!m || !F.n.trim()) return toast('Informe dia/mês (dd/mm) e a descrição'); cidade(F.c).fer = (cidade(F.c).fer || []).concat({ md: m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'), n: F.n.trim() }); S.ncfer = null; commit('Feriado municipal adicionado'); },
    cancelcfer: () => { S.ncfer = null; render(); }
  };
  if (A[act]) A[act]();
});
root.addEventListener('input', e => {
  const t = e.target, ds = t.dataset;
  if (t.id === 'gsearch') { S.gq = t.value; return render(); }
  if (t.id === 'bsearch') { S.q = t.value; return render(); }
  if (t.id === 'psearch') { S.pq = t.value; return render(); }
  if (t.id === 'wrefq') { S.wiz.refQ = t.value; return render(); }
  if (ds.aj) { const v = Number(t.value); const b = document.getElementById('ajv-' + ds.aj); if (b) b.textContent = (v > 0 ? '+' : '') + v + '%'; return; }
  if (ds.w === 'nome' || ds.w === 'cliente') { S.wiz.p[ds.w] = t.value; const h = root.querySelector('h1'); if (ds.w === 'nome' && h) h.textContent = t.value || 'Nova projeção'; return; }
  if (ds.c === 'nome' || ds.c === 'cliente' || ds.c === 'cidade') { S.carga.dados[ds.c] = t.value; return; }
  if (ds.nfu && ds.nfu !== 'grupo') { S.nfun[ds.nfu] = t.value; const b = root.querySelector('[data-act="addfun"]'); if (b) b.disabled = !S.nfun.nome.trim(); return; }
  if (ds.nru) { S.nrub[ds.nru] = t.value; const b = root.querySelector('[data-act="addrub"]'); if (b) b.disabled = !(S.nrub.cod && S.nrub.n.trim()); return; }
  if (ds.nb) { S.novaBase[ds.nb] = t.value; return; }
  if (t.id === 'cctq') { S.cctQ = t.value; S.cctPag = 0; return render(); }
  if (t.id === 'cidq') { S.cidQ = t.value; S.cidPag = 0; return render(); }
  if (ds.cctlotev) { S.cctLote = t.value; return; }
  if (ds.ncid === 'n') { S.ncid.n = t.value; const b = root.querySelector('[data-act="addcid"]'); if (b) b.disabled = !t.value.trim(); return; }
  if (ds.ncfer) { S.ncfer[ds.ncfer] = t.value; return; }
  if (ds.nfer) { S.nfer[ds.nfer] = t.value; root.querySelectorAll('[data-act="addferemp"],[data-act="addferloc"]').forEach(b => { b.disabled = !(S.nfer.d && S.nfer.n.trim()); }); return; }
  if (ds.nreal === 'outra') { S.nreal.outra = t.value; const b = root.querySelector('[data-act="addreal"]'); if (b) b.disabled = !(t.value.trim() && Number(S.nreal.i1) >= Number(S.nreal.i0)); return; }
});
root.addEventListener('change', e => {
  const t = e.target, ds = t.dataset;
  if (ds.sel && t.type === 'checkbox') { S.sel = t.checked ? S.sel.concat(ds.sel) : S.sel.filter(x => x !== ds.sel); return render(); }
  if (ds.psel) { S.psel = t.checked ? S.psel.concat(ds.psel) : S.psel.filter(x => x !== ds.psel); return render(); }
  if (t.id === 'pswitch') return go('projecao', { projId: t.value });
  if (ds.qm) { const [k, j] = ds.qm.split(':'); const m = S.wiz.p.manual; if (m) { if (!m[k]) m[k] = Array(S.wiz.p.prazo).fill(0); m[k][Number(j)] = Math.max(0, Math.round(Number(t.value) || 0)); } return render(); }
  if (ds.aj) { S.wiz.p.ajustes = Object.assign({}, S.wiz.p.ajustes, { [ds.aj]: Number(t.value) }); return render(); }
  if (ds.w === 'tipo') { S.wiz.p.tipo = t.value; return render(); }
  if (ds.w === 'ini') { const [m, y] = t.value.split('-').map(Number); S.wiz.p.ini = { m, y }; return render(); }
  if (ds.w === 'nome' || ds.w === 'cliente') return render();
  if (ds.wprem) { const p = S.wiz.p, v = t.value === '' ? null : Math.max(0, Number(t.value)); if (['absP', 'turn', 'licP', 'ferP'].includes(ds.wprem)) p[ds.wprem] = v; else { p.prem = Object.assign(clone(PREM0), p.prem); p.prem[ds.wprem] = v || 0; } return render(); }
  if (ds.prem) { const o = obra(S.obraId), v = Math.max(0, Number(t.value) || 0); if (ds.prem === 'turn') o.turn = v; else o.prem[ds.prem] = v; return commit('Premissa atualizada'); }
  if (ds.abs) { const o = obra(S.obraId); o.abs[Number(ds.abs)] = Math.max(0, Number(t.value) || 0); return commit('Absenteísmo atualizado'); }
  if (ds.just) { const o = obra(S.obraId); o.just = Object.assign({}, o.just); if (t.value) o.just[ds.just] = t.value; else delete o.just[ds.just]; return commit(t.value ? 'Diferença justificada' : null); }
  if (ds.c) { const d = S.carga.dados; if (ds.c === 'area' || ds.c === 'base') d[ds.c] = Number(t.value); else d[ds.c] = t.value; if (ds.c === 'trocaI' && t.value && !d.trocaB) d.trocaB = Object.keys(D.params.datas).find(y => Number(y) > Number(d.base)) || Object.keys(D.params.datas)[0]; return render(); }
  if (ds.file) { const f = t.files && t.files[0]; if (f) { S.carga.arquivos[ds.file] = { nome: f.name, info: ds.info }; render(); } return; }
  if (ds.map) { S.carga.mapa[ds.map] = t.value; return render(); }
  if (ds.crub) { const [cod, f] = ds.crub.split(':'); S.carga.rub[cod] = Object.assign({}, S.carga.rub[cod], { [f]: t.value }); return render(); }
  if (ds.cact === 'vtok') { S.carga.vtOk = t.checked; return render(); }
  if (ds.cact === 'nfcomp') { S.carga.nfComp = t.value; return render(); }
  if (ds.cact === 'erpjust') { S.carga.erpJust = t.value; return render(); }
  if (ds.sal) { const v = Number(t.value); if (v > 0) { pVig().sal[ds.sal] = v; commit('Salário de ' + fun(ds.sal).n + ' atualizado'); } return; }
  if (ds.par) { const v = Number(t.value); if (v >= 0) { const p = pVig(); if (ds.par.includes('.')) { const [a, b] = ds.par.split('.'); p[a] = Object.assign({}, p[a], { [b]: v }); } else p[ds.par] = v; commit('Parâmetro atualizado'); } return; }
  if (ds.fex) { const [k, tp] = ds.fex.split(':'), f = fun(k); f.ex = Object.assign({}, exm(k), { [tp]: Math.max(0, Number(t.value) || 0) }); return commit('Exames de ' + f.n + ' atualizados'); }
  if (ds.fad) { const [k, tp] = ds.fad.split(':'), f = fun(k); f.adic = Object.assign({ peric: 0, insal: 0, notH: 0 }, f.adic, { [tp]: Math.max(0, Number(t.value) || 0) }); return commit('Adicionais de ' + f.n + ' atualizados'); }
  if (ds.fferr) { fun(ds.fferr).ferr = Math.max(0, Number(t.value) || 0); return commit('Ferramentas de ' + fun(ds.fferr).n + ' atualizadas'); }
  if (ds.mix) { const o = obra(S.obraId); o.heMix = Object.assign({}, HEMIX0, o.heMix, { [ds.mix]: Math.max(0, Number(t.value) || 0) / 100 }); return commit('Distribuição de HE atualizada'); }
  if (ds.wmix) { const p = S.wiz.p, r = projetar(p); p.heMix = Object.assign({}, p.heMix || (r ? r.mixAp : HEMIX0), { [ds.wmix]: Math.max(0, Number(t.value) || 0) / 100 }); return render(); }
  if (ds.wreaj) { const p = S.wiz.p, cur = reajProj(p) || { i: Math.min(p.prazo - 1, 4), pct: 0 }; p.reaj = { i: cur.i, pct: cur.pct, [ds.wreaj]: Math.max(0, Number(t.value) || 0) }; return render(); }
  if (ds.w === 'cidade' || ds.w === 'origemCid') { S.wiz.p[ds.w] = t.value; if (ds.w === 'cidade') S.wiz.p.reaj = null; return render(); }
  if (ds.cctsal || ds.cctgrat || ds.cctben) { const key = ds.cctsal ? 'sal' : ds.cctgrat ? 'grat' : 'ben', [id, k] = (ds.cctsal || ds.cctgrat || ds.cctben).split(':'), T = cctDe(id); T[key] = Object.assign({}, T[key], { [k]: Math.max(0, Number(t.value) || 0) }); return commit(T.n + ' atualizada'); }
  if (ds.cctcmp) { const a = S.cctCmp || []; S.cctCmp = t.checked ? a.concat(ds.cctcmp).slice(0, 4) : a.filter(x => x !== ds.cctcmp); if (S.cctCmp.length < 2) S.cctVerCmp = false; return render(); }
  if (ds.cctsort) { S.cctSort = t.value; S.cctPag = 0; return render(); }
  if (ds.cctcom) { S.cctCom = t.value; return render(); }
  if (ds.cidf) { S.cidF = t.value; S.cidPag = 0; return render(); }
  if (ds.cctvinc) { const c = cidade(t.value); if (c) { c.cct = ds.cctvinc; return commit(c.n + ' agora usa ' + cctDe(ds.cctvinc).n); } return; }
  if (ds.cctmes) { cctDe(ds.cctmes).mesBase = Number(t.value); return commit('Data-base atualizada'); }
  if (ds.cctreaj) { cctDe(ds.cctreaj).reajEst = Math.max(0, Number(t.value) || 0); return commit('Reajuste estimado atualizado'); }
  if (ds.cctn) { cctDe(ds.cctn).n = t.value.trim() || cctDe(ds.cctn).n; return commit('Nome da convenção atualizado'); }
  if (ds.cid) { const [id, f] = ds.cid.split(':'), c = cidade(id); c[f] = f === 'cct' ? t.value : Math.max(0, Number(t.value) || 0); return commit(c.n + ' atualizada'); }
  if (ds.cidde) { const [id, de] = ds.cidde.split(':'), c = cidade(id); c.vtDe = Object.assign({}, c.vtDe, { [de]: Math.max(0, Number(t.value) || 0) }); return commit('Passagem atualizada'); }
  if (ds.ncid === 'cct') { S.ncid.cct = t.value; return; }
  if (ds.trc) { const o = obra(S.obraId), [j, f] = ds.trc.split(':'); o.trocas[Number(j)][f] = Number(t.value); return commit('Troca de tabela atualizada'); }
  if (ds.aus) { const o = obra(S.obraId), [k, i] = ds.aus.split(':'); if (!o[k]) o[k] = Array(nM(o)).fill(0); o[k][Number(i)] = Math.max(0, Number(t.value) || 0); return commit(k === 'abs' ? 'Absenteísmo atualizado' : k === 'lic' ? 'Licenças atualizadas' : 'Férias atualizadas'); }
  if (ds.nreal) { S.nreal[ds.nreal] = ds.nreal === 'outra' ? t.value : ['tipo', 'k'].includes(ds.nreal) ? t.value : Number(t.value); return render(); }
  if (ds.nfer) { S.nfer[ds.nfer] = t.value; return render(); }
  if (ds.cact === 'realoc') { S.carga.realoc = t.value; return render(); }
  if (ds.ben) { const v = Number(t.value); if (v >= 0) { pVig().ben[ds.ben] = v; commit('Benefício atualizado'); } return; }
  if (ds.enc) { const [id, f] = ds.enc.split(':'), P = D.params.datas[S.pAno && D.params.datas[S.pAno] ? S.pAno : D.params.vigente], it = P.enc.find(x => x.id === id), v = Number(t.value); if (it && v >= 0) { it[f] = v; commit(it.n + ' atualizado'); } return; }
  if (ds.fgrupo) { fun(ds.fgrupo).grupo = t.value; return commit('Grupo de ' + fun(ds.fgrupo).n + ' atualizado'); }
  if (ds.fpc) { fun(ds.fpc).pc = t.value.trim(); return commit('Conta de ' + fun(ds.fpc).n + ' atualizada'); }
  if (ds.fexame) { fun(ds.fexame).exame = Math.max(0, Number(t.value) || 0); return commit('Custo de exames atualizado'); }
  if (ds.nfu === 'grupo') { S.nfun.grupo = t.value; return; }
  if (ds.rtipo) { D.rubricas.find(r => r.cod === Number(ds.rtipo)).tipo = t.value; return commit('Rubrica atualizada'); }
  if (ds.rcomp) { D.rubricas.find(r => r.cod === Number(ds.rcomp)).comp = t.value; return commit('Rubrica atualizada'); }
  if (ds.nb) { S.novaBase[ds.nb] = t.value; return render(); }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { const s = document.getElementById('gsearch'); if (s) { e.preventDefault(); s.focus(); } }
  if (e.key === 'Escape') { if (S.drawer) { S.drawer = null; render(); } else if (S.gq) { S.gq = ''; render(); } }
});

/* ================= início ================= */
const H = (location.hash || '').replace('#', '');
if (TELAS[H] && !['obra', 'projecao', 'nova', 'cmpproj'].includes(H)) S.route = H;
render();
})();
