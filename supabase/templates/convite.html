<!doctype html>
<html lang="pt-BR">
  <body style="font-family: Arial, sans-serif; color: #17191c; line-height: 1.5">
    <h2 style="margin: 0 0 12px">Você foi convidado para o ITO</h2>
    <p>
      O ITO é a plataforma de histórico de mão de obra das obras da Clássica Engenharia. Para
      entrar, defina a sua senha pelo link abaixo.
    </p>
    <p>
      <a
        href="{{ .ConfirmationURL }}"
        style="
          display: inline-block;
          background: #f2b705;
          color: #17191c;
          padding: 10px 20px;
          border-radius: 999px;
          text-decoration: none;
          font-weight: bold;
        "
        >Definir senha e entrar</a
      >
    </p>
    <p style="color: #5c6677; font-size: 13px">
      O link vale por 24 horas. Se não esperava este convite, ignore este e-mail.
    </p>
  </body>
</html>
