<!doctype html>
<html lang="pt-BR">
  <body style="font-family: Arial, sans-serif; color: #17191c; line-height: 1.5">
    <h2 style="margin: 0 0 12px">Definir uma nova senha no ITO</h2>
    <p>Recebemos um pedido para definir a sua senha do ITO. Use o link abaixo.</p>
    <p>
      <a
        href="{{ .ConfirmationURL }}"
        style="
          display: inline-block;
          background: #f2b705;
          color: #17191c;
          padding: 10px 20px;
          border-radius: 999px;
          text-decoration: none;
          font-weight: bold;
        "
        >Definir nova senha</a
      >
    </p>
    <p style="color: #5c6677; font-size: 13px">
      O link vale por 1 hora. Se expirar, peça de novo na tela de entrada. Se não pediu, ignore este
      e-mail: a senha atual continua valendo.
    </p>
  </body>
</html>
